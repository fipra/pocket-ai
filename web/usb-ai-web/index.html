<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#171717"><meta name="description" content="LlamaNest Web: private AI running in your browser"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css"><title>LlamaNest Web by FipraAI</title></head>
<body><div id="app" class="app">
  <aside class="sidebar" id="sidebar"><div class="brand"><span class="mark">✦</span> <span class="brand-name">LlamaNest<small class="brand-credit">by FipraAI</small></span> <small>WEB</small></div><button id="new-chat" class="new-chat" data-i18n="newChat"></button><div class="side-label" data-i18n="recent"></div><nav id="chat-list" class="chat-list"></nav><div class="sidebar-bottom"><button id="models-open" class="side-action" data-i18n="models"></button><button id="docs-open" class="side-action" data-i18n="documents"></button><button id="memory-open" class="side-action" data-i18n="memory"></button><button id="export-chat" class="side-action" data-i18n="export"></button><button id="delete-chat" class="side-action danger" data-i18n="deleteChat"></button><label class="language"><span data-i18n="language"></span><select id="language"><option value="en">English</option><option value="it">Italiano</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="es">Español</option></select></label></div></aside>
  <main class="main"><header class="topbar"><button id="menu" class="icon-button mobile-menu" aria-label="Menu">☰</button><button id="model-trigger" class="model-trigger"></button><span class="local-pill" data-i18n="private"></span><span class="spacer"></span><button id="install" class="text-button" data-i18n="install"></button></header><section id="thread" class="thread"><div id="messages" class="thread-inner"></div></section><div class="composer-area"><div class="composer-wrap"><p id="browser-model-warning" class="browser-model-warning" role="note" hidden></p><div id="status" class="status" role="status"></div><form id="prompt-form" class="composer"><div id="chat-attachments" class="chat-attachments"></div><textarea id="prompt" rows="2" data-placeholder="prompt" aria-label="Prompt"></textarea><div class="composer-bottom"><button type="button" id="attach-files" class="tool-chip attach-button">＋</button><input id="chat-files" type="file" accept=".txt,.md,.csv,.json,.pdf,text/plain,application/pdf" multiple hidden><span class="spacer"></span><button type="button" id="thinking-toggle" class="tool-chip" aria-pressed="false" data-i18n="thinkingOff"></button><button type="button" id="stop" class="round-button" hidden aria-label="Stop">■</button><button type="submit" id="send" class="round-button" aria-label="Send">↑</button></div></form><p class="composer-note" data-i18n="localNote"></p></div></div></main>
</div>
<dialog id="models-dialog"><header class="dialog-head"><div><h2 data-i18n="models"></h2><p data-i18n="modelHint"></p></div><button class="close" data-close="models-dialog" aria-label="Close">×</button></header><div class="dialog-body"><div id="model-progress" class="progress" role="status" aria-live="polite"></div><section id="first-model-choice" class="first-model-choice" hidden><strong data-i18n="firstModelTitle"></strong><p data-i18n="firstModelExplanation"></p><div class="first-model-actions"><button id="use-existing-model" type="button" class="action" data-i18n="useExistingModel"></button><button id="download-starter-model" type="button" class="action subtle" data-i18n="downloadStarterModel"></button></div></section><p id="models-browser-warning" class="browser-model-warning" role="note" hidden></p><div id="hardware-advice" class="hardware-advice" role="note"></div><p id="capability" class="hint"></p><p id="folder-hint" class="hint"></p><p class="hint"><span data-i18n="desktopQuantizeNote">Model quantization requires the Mac or Windows app and llama-quantize.</span> <a href="https://llamanest.vercel.app/" target="_blank" rel="noopener noreferrer" data-i18n="desktopDownloadLink">Download desktop versions</a></p><h3 data-i18n="recommended"></h3><div id="catalog" class="cards"></div><h3 data-i18n="searchModels"></h3><p class="hint" data-i18n="searchHint"></p><form id="hub-search-form" class="search-form"><input id="hub-query" type="search" minlength="2" maxlength="80" data-placeholder="searchPlaceholder"><button type="submit" class="action" data-i18n="search"></button></form><p id="hub-status" class="hint" role="status"></p><div id="hub-results" class="cards"></div><button id="hub-more" class="action subtle" hidden data-i18n="more"></button><h3 data-i18n="myModels"></h3><div id="saved-models" class="cards"></div><button id="choose-folder" type="button" class="file-button" data-i18n="chooseFolder"></button> <label class="file-button"><span data-i18n="chooseFile"></span><input id="model-file" type="file" accept=".gguf,application/octet-stream" multiple hidden></label><p class="hint" data-i18n="fileHint"></p><section class="split-tool"><h3 data-i18n="splitTitle"></h3><p class="hint" data-i18n="splitHint"></p><label class="file-button"><span data-i18n="splitChooseFile"></span><input id="split-file" type="file" accept=".gguf,application/octet-stream" hidden></label> <button id="split-start" type="button" class="action" data-i18n="splitStart" disabled></button> <button id="split-cancel" type="button" class="action subtle" data-i18n="splitCancel" hidden></button><p id="split-progress" class="progress" role="status" aria-live="polite"></p></section></div></dialog>
<dialog id="memory-dialog"><header class="dialog-head"><div><h2 data-i18n="memory"></h2><p data-i18n="memoryIntro"></p></div><button class="close" data-close="memory-dialog" aria-label="Close">×</button></header><div class="dialog-body"><form id="memory-form" class="memory-form"><input id="memory-id" type="hidden"><textarea id="memory-text" maxlength="500" required data-placeholder="memoryPlaceholder"></textarea><button class="action" type="submit" data-i18n="memorySave"></button></form><div id="memory-list"></div><button id="memory-export" class="action subtle" type="button" data-i18n="memoryExport"></button> <label class="file-button"><span data-i18n="memoryImport"></span><input id="memory-import" type="file" accept=".md,text/markdown" hidden></label></div></dialog>
<dialog id="docs-dialog"><header class="dialog-head"><div><h2 data-i18n="documents"></h2><p data-i18n="docsHint"></p></div><button class="close" data-close="docs-dialog" aria-label="Close">×</button></header><div class="dialog-body"><label class="file-button"><span data-i18n="addDocuments"></span><input id="doc-file" type="file" accept=".txt,.md,.csv,.json,.pdf,text/plain,application/pdf" multiple hidden></label><p id="doc-status" class="progress" role="status" aria-live="polite"></p><div id="doc-list" class="cards"></div><div id="legacy-doc-list" class="cards"></div></div></dialog>
<script>
if (location.protocol === 'file:') {
  const messages = {
    en: ['Open LlamaNest Web with the launcher', 'This app needs a local web address. Double-click “Open LlamaNest Web.command” on Mac or “Open LlamaNest Web.bat” on Windows in this folder. The launcher installs dependencies on first use, then opens the working app.'],
    it: ['Apri LlamaNest Web con il programma di avvio', 'Questa app richiede un indirizzo web locale. In questa cartella fai doppio clic su “Open LlamaNest Web.command” su Mac oppure “Open LlamaNest Web.bat” su Windows. Al primo avvio verranno installate le dipendenze, poi si aprirà l’app funzionante.'],
    fr: ['Ouvrez LlamaNest Web avec le lanceur', 'Cette application nécessite une adresse web locale. Dans ce dossier, ouvrez « Open LlamaNest Web.command » sur Mac ou « Open LlamaNest Web.bat » sur Windows.'],
    de: ['LlamaNest Web mit dem Starter öffnen', 'Diese App benötigt eine lokale Webadresse. Öffnen Sie in diesem Ordner „Open LlamaNest Web.command“ auf dem Mac oder „Open LlamaNest Web.bat“ unter Windows.'],
    es: ['Abre LlamaNest Web con el iniciador', 'Esta aplicación necesita una dirección web local. En esta carpeta abre «Open LlamaNest Web.command» en Mac o «Open LlamaNest Web.bat» en Windows.']
  };
  const [title, detail] = messages[navigator.language.slice(0, 2)] || messages.en;
  document.addEventListener('DOMContentLoaded', () => {
    document.body.replaceChildren();
    const panel = document.createElement('main');
    panel.style.cssText = 'max-width:600px;margin:12vh auto;padding:32px;font:16px/1.6 system-ui,sans-serif;color:#202123';
    const heading = document.createElement('h1'); heading.textContent = title;
    const paragraph = document.createElement('p'); paragraph.textContent = detail;
    panel.append(heading, paragraph); document.body.append(panel);
  });
}
</script>
<script type="module">
import { isSmartphone, showPhoneGate } from './phone-gate.js';
if (isSmartphone()) showPhoneGate();
else import('./main.js');
</script></body></html>
