name: Windows Prism Bonsai portable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/package-windows-prism.ps1'
      - 'scripts/windows-prism-launcher.cmd'
      - 'scripts/test-prism-inference.py'
      - 'scripts/PRISM_WINDOWS.txt'
      - '.github/workflows/windows-prism-portable.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'web/**'
      - 'models/prism-catalog.json'
      - 'Cargo.*'
      - 'scripts/*prism*'
      - 'scripts/PRISM_WINDOWS.txt'
      - '.github/workflows/windows-prism-portable.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust
        run: rustup update stable
      - name: Test Rust
        shell: pwsh
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed' }
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Package PrismML
        shell: pwsh
        run: |
          $url = 'https://github.com/oschwartz10612/poppler-windows/releases/download/v26.09.0-0/Release-26.09.0-0.zip'
          curl.exe -fL --retry 3 $url -o "$env:RUNNER_TEMP/poppler.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Poppler download failed' }
          Expand-Archive "$env:RUNNER_TEMP/poppler.zip" "$env:RUNNER_TEMP/poppler"
          $pdf = Get-ChildItem "$env:RUNNER_TEMP/poppler" -Filter pdftotext.exe -Recurse -File | Select-Object -First 1
          & scripts/package-windows-prism.ps1 -PdfToText $pdf.FullName -Zip
      - name: Test Bonsai inference with packaged CPU runtime
        run: python scripts/test-prism-inference.py release/LlamaNest-Prism-Bonsai-Windows-x64
      - uses: actions/upload-artifact@v4
        with:
          name: LlamaNest-Prism-Bonsai-Windows-x64
          path: release/LlamaNest-Prism-Bonsai-Windows-x64.zip
          if-no-files-found: error

  publish:
    needs: package
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LlamaNest-Prism-Bonsai-Windows-x64
      - name: Publish verified Windows Prism download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -eu
          tag=prism-bonsai-windows-2026-11-01
          cat > release-notes.txt <<'EOF'
          LlamaNest for Windows x64 with PrismML and Ternary Bonsai 2 9B support.

          Extract the complete ZIP and open Avvia LlamaNest Prism.cmd. Vulkan is selected when detected; a CPU runtime is included. Bonsai downloads on first use (2.42 GB), with SHA-256 and size verification. Models and private data are not bundled.

          Validated on a Windows CI runner with real Bonsai CPU inference. GPU performance depends on the device and has not been validated by this build. The bundled LlamaNest license applies; third-party runtime and model licenses are separate.
          EOF
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$RELEASE_COMMIT" --title 'LlamaNest PrismML + Bonsai for Windows x64' --notes-file release-notes.txt
          fi
          gh release upload "$tag" LlamaNest-Prism-Bonsai-Windows-x64.zip --clobber
