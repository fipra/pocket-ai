name: Windows portable

on:
  pull_request:
    paths:
      - 'src/**'
      - 'web/**'
      - 'models/catalog.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/package-windows.ps1'
      - '.github/workflows/windows-portable.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'models/catalog.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/package-windows.ps1'
      - '.github/workflows/windows-portable.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup update stable
      - name: Download portable runtime tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $tools = Join-Path $env:RUNNER_TEMP 'usb-ai-tools'
          New-Item $tools -ItemType Directory -Force | Out-Null
          $llamaZip = Join-Path $tools 'llama.zip'
          $vulkanZip = Join-Path $tools 'llama-vulkan.zip'
          $popplerZip = Join-Path $tools 'poppler.zip'
          Invoke-WebRequest 'https://github.com/ggml-org/llama.cpp/releases/download/b11836/llama-b11836-bin-win-cpu-x64.zip' -OutFile $llamaZip
          Invoke-WebRequest 'https://github.com/ggml-org/llama.cpp/releases/download/b11836/llama-b11836-bin-win-vulkan-x64.zip' -OutFile $vulkanZip
          if ((Get-FileHash $llamaZip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '4da5a55754e47bb062fd4bb31ce654776f1e25901ff77bad6485a0df5e6be2cc') { throw 'CPU llama.cpp archive checksum mismatch' }
          if ((Get-FileHash $vulkanZip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'cd79abc3f25bce0086918d43f7b5562dc760d9809429f1a9037941185bc7cdf4') { throw 'Vulkan llama.cpp archive checksum mismatch' }
          Invoke-WebRequest 'https://github.com/oschwartz10612/poppler-windows/releases/download/v26.09.0-0/Release-26.09.0-0.zip' -OutFile $popplerZip
          Expand-Archive $llamaZip (Join-Path $tools 'llama')
          Expand-Archive $vulkanZip (Join-Path $tools 'vulkan')
          Expand-Archive $popplerZip (Join-Path $tools 'poppler')
          Add-Content $env:GITHUB_ENV "USB_AI_VULKAN_RUNTIME_DIR=$(Join-Path $tools 'vulkan')"
          $llama = Get-ChildItem (Join-Path $tools 'llama') -Filter 'llama-cli.exe' -Recurse -File | Select-Object -First 1
          $llamaServer = Get-ChildItem (Join-Path $tools 'llama') -Filter 'llama-server.exe' -Recurse -File | Select-Object -First 1
          $llamaQuantize = Get-ChildItem (Join-Path $tools 'llama') -Filter 'llama-quantize.exe' -Recurse -File | Select-Object -First 1
          $pdf = Get-ChildItem (Join-Path $tools 'poppler') -Filter 'pdftotext.exe' -Recurse -File | Select-Object -First 1
          if (!$llama -or !$llamaServer -or !$llamaQuantize -or !$pdf) { throw 'Required runtime executable missing from downloaded archives' }
          Add-Content $env:GITHUB_PATH $llama.DirectoryName
          Add-Content $env:GITHUB_PATH $llamaServer.DirectoryName
          Add-Content $env:GITHUB_PATH $llamaQuantize.DirectoryName
          Add-Content $env:GITHUB_PATH $pdf.DirectoryName
      - name: Test and package
        shell: pwsh
        run: |
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests failed' }
          & scripts/package-windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows package failed' }
          $folder = 'release/USB-AI-Rust-Windows-x64'
          foreach ($required in @('Avvia LlamaNest.cmd','Avvia LlamaNest GPU.cmd','bin/usb-ai-rust.exe','bin/llama-cli.exe','bin/llama-server.exe','bin/llama-quantize.exe','bin/gpu/llama-server.exe','bin/gpu/ggml-vulkan.dll','bin/pdftotext.exe','models/catalog.json','PocketAI-data/workspace.json','LICENSE','LICENSING_HISTORY.md')) {
            if (!(Test-Path (Join-Path $folder $required))) { throw "Package is missing $required" }
          }
          foreach ($obsolete in @('Avvia USB AI Rust.cmd','Avvia Offllama.cmd','Avvia USB AI Rust GPU.cmd','Avvia Offllama GPU.cmd')) {
            if (Test-Path (Join-Path $folder $obsolete)) { throw "Package contains obsolete launcher $obsolete" }
          }
          $workspace = Get-Content (Join-Path $folder 'PocketAI-data/workspace.json') -Raw | ConvertFrom-Json
          if (@($workspace.chats).Count -ne 0) { throw 'Package contains conversations' }
          & (Join-Path $folder 'bin/llama-cli.exe') --help *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Packaged llama-cli cannot start' }
          & (Join-Path $folder 'bin/llama-server.exe') --help *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Packaged llama-server cannot start' }
          & (Join-Path $folder 'bin/gpu/llama-server.exe') --help *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Vulkan llama-server cannot start' }
          & (Join-Path $folder 'bin/gpu/llama-server.exe') --list-devices *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Vulkan llama-server cannot list devices' }
          $quantizeHelp = (& (Join-Path $folder 'bin/llama-quantize.exe') --help 2>&1 | Out-String)
          foreach ($kind in @('Q8_0','Q4_K_M','Q3_K_M','Q2_K')) {
            if (-not $quantizeHelp.Contains($kind)) { throw "Packaged llama-quantize lacks $kind" }
          }
          & (Join-Path $folder 'bin/pdftotext.exe') -v 2>$null
          if ($LASTEXITCODE -ne 0) { throw 'Packaged pdftotext cannot start' }
          $importHome = Join-Path $env:RUNNER_TEMP 'usb-ai-import-check'
          New-Item $importHome -ItemType Directory -Force | Out-Null
          $sample = Join-Path $env:RUNNER_TEMP 'sample-model.gguf'
          [System.IO.File]::WriteAllBytes($sample, [System.Text.Encoding]::ASCII.GetBytes('GGUFtest'))
          $env:USB_AI_DIR = $importHome
          $app = Start-Process -FilePath (Resolve-Path (Join-Path $folder 'bin/usb-ai-rust.exe')) -PassThru -WindowStyle Hidden
          try {
            $base = 'http://127.0.0.1:48157'
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                $null = Invoke-WebRequest $base -TimeoutSec 2
                $ready = $true
                break
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ready) { throw 'Packaged app did not start its localhost server' }
            $imported = Invoke-WebRequest "$base/import-model/CI-Local.GGUF" -Method Post -InFile $sample -ContentType 'application/octet-stream'
            if ($imported.StatusCode -ne 200) { throw 'GGUF import failed' }
            $state = $imported.Content | ConvertFrom-Json
            if ($state.model -ne 'CI-Local.GGUF') { throw 'Imported GGUF was not selected' }
            if (!(Test-Path (Join-Path $importHome 'models/CI-Local.GGUF'))) { throw 'Imported GGUF was not saved in models' }
          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            Remove-Item Env:USB_AI_DIR -ErrorAction SilentlyContinue
          }
          Compress-Archive -Path $folder -DestinationPath 'USB-AI-Rust-Windows-x64.zip' -Force
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: USB-AI-Rust-Windows-x64
          path: USB-AI-Rust-Windows-x64.zip
          if-no-files-found: error
      - name: Publish portable download
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'rust-windows-stop-2026-10-24'
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target '${{ github.sha }}' --title 'LlamaNest Rust for Windows x64 — streaming' --notes 'Windows x64 build with live response streaming, a Stop button, and a persistent loaded model. Extract the ZIP and launch Avvia LlamaNest.cmd. The bundled LICENSE applies to this release.'
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release' }
          }
          gh release upload $tag 'USB-AI-Rust-Windows-x64.zip' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload Windows ZIP' }
          gh release edit $tag --prerelease=false
          if ($LASTEXITCODE -ne 0) { throw 'Could not finalize Windows release' }
