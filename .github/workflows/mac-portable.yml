name: Mac portable

on:
  pull_request:
    paths:
      - 'src/**'
      - 'web/**'
      - 'models/catalog.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/package-mac.py'
      - 'scripts/cuda_lab.py'
      - 'scripts/gguf_prepare.py'
      - 'scripts/export_model.py'
      - 'scripts/test_export_model.py'
      - 'scripts/setup-mac-gguf.command'
      - 'scripts/mac-launcher.command'
      - '.github/workflows/mac-portable.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'models/catalog.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/package-mac.py'
      - 'scripts/cuda_lab.py'
      - 'scripts/gguf_prepare.py'
      - 'scripts/export_model.py'
      - 'scripts/test_export_model.py'
      - 'scripts/setup-mac-gguf.command'
      - 'scripts/mac-launcher.command'
      - '.github/workflows/mac-portable.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyTorch for Model Creator tests
        if: ${{ matrix.architecture == 'arm64' }}
        run: python3 -m pip install 'torch==2.6.0'
      - name: Install build tools
        run: |
          rustup update stable
          brew install llama.cpp poppler
      - name: Test and package
        run: |
          if [ '${{ matrix.architecture }}' = 'arm64' ]; then export LLAMANEST_CREATOR_PYTHON="$(command -v python3)"; fi
          cargo test --locked
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/package-mac.py
          folder="release/USB-AI-Rust-mac-${{ matrix.architecture }}"
          test -f "$folder/Avvia LlamaNest.command"
          test ! -e "$folder/Installa Fine Tuning GGUF.command"
          test ! -e "$folder/bin/converter"
          test ! -e "$folder/Avvia USB AI Rust.command"
          test ! -e "$folder/Avvia Offllama.command"
          test -x "$folder/bin/usb-ai-rust"
          test -x "$folder/bin/llama-cli"
          test -x "$folder/bin/llama-server"
          test -x "$folder/bin/llama-quantize"
          test -x "$folder/bin/pdftotext"
          test -f "$folder/models/catalog.json"
          test -f "$folder/LICENSE"
          test -f "$folder/LICENSING_HISTORY.md"
          python3 - "$folder/PocketAI-data/workspace.json" <<'PY'
          import json, sys
          workspace = json.load(open(sys.argv[1]))
          assert not workspace.get('chats')
          assert not workspace.get('documents')
          PY
          "$folder/bin/llama-cli" --help >/dev/null 2>&1
          "$folder/bin/llama-server" --help >/dev/null 2>&1
          quantize_help="$("$folder/bin/llama-quantize" --help 2>&1 || true)"
          for kind in Q8_0 Q4_K_M Q3_K_M Q2_K; do
            [[ "$quantize_help" == *"$kind"* ]] || { echo "Packaged llama-quantize lacks $kind" >&2; exit 1; }
          done
          python3 - "$folder" "${{ matrix.architecture }}" <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          folder = Path(sys.argv[1])
          linked_cpu = (folder / 'lib/libggml-cpu.dylib').is_file()
          dynamic_cpu = any((folder / 'bin').glob('libggml-cpu*.so'))
          assert linked_cpu or dynamic_cpu, 'Packaged llama-cli has no CPU backend'
          devices = subprocess.run([str(folder / 'bin/llama-cli'), '--list-devices'],
                                   text=True, capture_output=True, check=True)
          assert any(name in devices.stdout + devices.stderr for name in ('BLAS:', 'Metal:', 'CPU:')), devices.stdout + devices.stderr
          server_devices = subprocess.run([str(folder / 'bin/llama-server'), '--list-devices'],
                                          text=True, capture_output=True, check=True)
          if sys.argv[2] == 'arm64':
              output = server_devices.stdout + server_devices.stderr
              assert re.search(r'\b(?:Metal|MTL\d+):', output), output
          PY
          "$folder/bin/pdftotext" -v >/dev/null 2>&1
          ditto -c -k --sequesterRsrc --keepParent "$folder" "USB-AI-Rust-mac-${{ matrix.architecture }}.zip"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: USB-AI-Rust-mac-${{ matrix.architecture }}
          path: USB-AI-Rust-mac-${{ matrix.architecture }}.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: USB-AI-Rust-mac-*
          merge-multiple: true
      - name: Publish Mac downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag='rust-mac-stop-2026-10-24'
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target '${{ github.sha }}' --title 'LlamaNest Rust for macOS — streaming' --notes 'Mac builds with live response streaming, a Stop button, and a persistent loaded model. Download the ZIP matching your Mac, extract the complete folder and launch Avvia LlamaNest.command. The bundled LICENSE applies to this release.'
          fi
          gh release upload "$tag" USB-AI-Rust-mac-*.zip --clobber
          gh release edit "$tag" --prerelease=false
